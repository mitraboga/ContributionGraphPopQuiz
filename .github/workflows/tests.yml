name: Bot tests
on:
  push:
    paths: ["**.py", "requirements.txt", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["**.py", "requirements.txt", ".github/workflows/tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
